# OPTIONAL BACKUP deployment — GitHub Pages.
# The primary live site is Firebase Hosting (see README → Deployment).
# This workflow exists so the portfolio can also be published to
# https://umararif4472-arch.github.io/rope-portfolio/ if ever needed.
name: Deploy to GitHub Pages (backup)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: VITE_BASE=/rope-portfolio/ npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
